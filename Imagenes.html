<!DOCTYPE html> <!-- Indica el uso de html 5 -->
<!-- Adame Durán Brenda Denis 0783 5J -->
<!-- Estructura principal e idioma -->
<html lang="en">

<!-- Caracteristícas principales del documento en el encabezado -->
<head>
<!-- Configuración para aceptar caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Adaptabilidad para pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Imagenes en HTML</title>
</head>

<!-- Cuerpo del documento -->
<body>
    <!-- Encabezado principal de la sección -->
    <h2>Imagenes en HTML</h2>
    <!-- Sección de imagen local en la misma carpeta -->
    <h3>Locales</h3>
    <!-- src: ruta del archivo. alt: texto alternativo para accesibilidad y si la imagen no carga -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Sección de imagen local guardada en una subcarpeta -->
    <h3>Locales redismensionado</h3>
    <!-- src con subcarpeta "imagenes/". width y height cambian las dimensiones visuales en píxeles -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Sección de imagen en un servidor externo/internet -->
    <h3>Desde internet</h3>
    <!-- src utiliza una URL absoluta (http/https). width y height dan tamaño -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">

    <!-- Sección de imagen animada (formato GIF) desde internet -->
    <h3>Animaciones</h3>
    <!-- La etiqueta <img> también sirve para cargar GIFs animados -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>

<!-- Cierre del documento -->
</html>
