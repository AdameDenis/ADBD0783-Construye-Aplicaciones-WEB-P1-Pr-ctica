<!DOCTYPE html><!-- Indica el uso de html 5 -->
<!-- Adame Durán Brenda Denis 0783 5J -->
<!-- Estructura principal e idioma -->
<html lang="en">

<!-- Caracteristícas principales del documento en el encabezado -->
<head>
<!-- Configuración para aceptar caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Adaptabilidad para pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Enlaces en HTML</title>
</head>

<!--Cuerpo del documento-->
<body>
    <!-- Encabezado de la sección -->
    <h2>Tipos de enlaces en HTML</h2>
     <!-- Enlaces a páginas locales (archivos del mismo sitio web) -->
    <p><strong>Enlaces/Hipervinculos a otra página del mismo sitio.</strong></p>
    <!-- Enlace interno con comportamiento por defecto (abre en la misma pestaña) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- target="_self": Abre el enlace en la misma pestaña o marco (comportamiento predeterminado) -->
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br>
    <!-- target="_blank": Abre el enlace en una pestaña o ventana nueva -->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br>
    <!-- target="_parent": Abre el enlace en el marco (frame) padre del elemento actual -->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br>
    <!-- target="_top": Cancela todos los marcos y abre el enlace en el cuerpo completo de la ventana -->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br>
    <!-- Enlaces a sitios externos (URLs absolutas fuera del sitio web) -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>
    <!-- Enlace externo simple -->
    <a href="https://www.google.com/">Google</a><br>
    <!-- Enlace externo que abre en la misma pestaña -->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>
    <!-- Enlace externo que abre en una nueva pestaña (muy común para sitios externos) -->
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>
    <!-- Enlace externo que se abre en el marco padre -->
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>
    <!-- Enlace externo que se abre en la ventana superior/completa -->
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>
</body>
<!-- Cierre del documento -->
</html>
