<!DOCTYPE html>
<!-- Adame Durán Brenda Denis 0783 5J -->
<!-- Estructura principal e idioma -->
<html lang="en">

<!-- Caracteristícas principales del documento en el encabezado -->
<head>
<!-- Configuración para aceptar caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Adaptabilidad para pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Encabezados HTML</title>
</head>

<body><!-- Cuerpo con los 6 tipos de encabezados -->
   
    <h1>Titulo 1</h1> <!-- Título muy importante -->
    <h2>Titulo 2</h2> <!-- Importante -->
    <h3>Titulo 3</h3> <!-- Subtíulo -->
    <h4>Titulo 4</h4> <!-- Poco importante -->
    <h5>Titulo 5</h5> <!-- No importa -->
    <h6>Titulo 6</h6> <!-- Realmente no importa -->
</body>
<!-- Cierre del documento -->
</html>
